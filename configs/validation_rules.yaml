rules:
  # 1. Schema and Type Checks
  - id: "RULE-SCHEMA-001"
    name: "orders_amount_type_and_range"
    category: "schema_and_type"
    target_table: "orders"
    severity: "HIGH"
    description: "Orders total_amount must be a non-negative numeric float"
    condition: "total_amount < 0"

  - id: "RULE-SCHEMA-DRIFT-001"
    name: "orders_schema_status_drift"
    category: "schema_and_type"
    target_table: "orders"
    severity: "HIGH"
    description: "Orders records contain missing or empty status due to upstream schema drift"
    condition: "status IS NULL OR status = ''"

  - id: "RULE-SCHEMA-002"
    name: "shipments_quantity_type_and_range"
    category: "schema_and_type"
    target_table: "shipments"
    severity: "HIGH"
    description: "Shipment quantity must be greater than zero"
    condition: "quantity <= 0"

  # 2. Null and Required-Field Checks
  - id: "RULE-NULL-001"
    name: "orders_required_fields"
    category: "null_and_required"
    target_table: "orders"
    severity: "CRITICAL"
    description: "order_id, supplier_id, and order_date must not be null"
    condition: "order_id IS NULL OR supplier_id IS NULL OR order_date IS NULL"

  - id: "RULE-NULL-002"
    name: "suppliers_required_fields"
    category: "null_and_required"
    target_table: "suppliers"
    severity: "CRITICAL"
    description: "supplier_id and name must not be null"
    condition: "supplier_id IS NULL OR name IS NULL OR name = ''"

  # 3. Duplicate Detection
  - id: "RULE-DUP-001"
    name: "duplicate_orders_detection"
    category: "duplicate_detection"
    target_table: "orders"
    severity: "HIGH"
    description: "Primary key order_id must be unique"
    rule_type: "duplicate"
    key_columns: ["order_id"]

  - id: "RULE-DUP-002"
    name: "duplicate_shipments_detection"
    category: "duplicate_detection"
    target_table: "shipments"
    severity: "HIGH"
    description: "Primary key shipment_id must be unique"
    rule_type: "duplicate"
    key_columns: ["shipment_id"]

  # 4. Referential Integrity
  - id: "RULE-RI-001"
    name: "orders_supplier_fk"
    category: "referential_integrity"
    target_table: "orders"
    foreign_table: "suppliers"
    foreign_key: "supplier_id"
    primary_key: "supplier_id"
    severity: "CRITICAL"
    description: "Order references a supplier_id that does not exist in suppliers warehouse table"

  - id: "RULE-RI-002"
    name: "shipments_order_fk"
    category: "referential_integrity"
    target_table: "shipments"
    foreign_table: "orders"
    foreign_key: "order_id"
    primary_key: "order_id"
    severity: "CRITICAL"
    description: "Shipment references an order_id that does not exist in orders warehouse table"

  # 5. Cross-System Reconciliation
  - id: "RULE-RECON-001"
    name: "shipment_order_quantity_reconciliation"
    category: "cross_system_reconciliation"
    severity: "HIGH"
    description: "Shipment quantity significantly mismatches order items count"
    rule_type: "cross_system"
    table_a: "shipments"
    table_b: "orders"
    join_key_a: "order_id"
    join_key_b: "order_id"
    condition: "shipments.quantity > orders.items_count * 2"

  - id: "RULE-RECON-002"
    name: "delivered_shipment_on_cancelled_order"
    category: "cross_system_reconciliation"
    severity: "CRITICAL"
    description: "Shipment is DELIVERED but corresponding Order is CANCELLED"
    rule_type: "cross_system"
    table_a: "shipments"
    table_b: "orders"
    join_key_a: "order_id"
    join_key_b: "order_id"
    condition: "shipments.status = 'DELIVERED' AND orders.status = 'CANCELLED'"

  # 6. Freshness and Volume Anomalies
  - id: "RULE-ANOMALY-001"
    name: "orders_freshness_check"
    category: "freshness_and_volume"
    target_table: "orders"
    severity: "MEDIUM"
    description: "Orders data staleness exceeds max allowable threshold (30 days)"
    rule_type: "freshness"
    timestamp_column: "updated_at"
    max_staleness_days: 30

  - id: "RULE-ANOMALY-002"
    name: "orders_volume_drop_check"
    category: "freshness_and_volume"
    target_table: "orders"
    severity: "HIGH"
    description: "Orders table volume falls below expected minimum threshold"
    rule_type: "volume_drop"
    min_expected_count: 5
