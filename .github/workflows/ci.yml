name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Run Evaluation Harness
        run: |
          python -c "from eval.runner import EvaluationRunner; summary = EvaluationRunner().run_all(); print('Eval completed successfully. Total scenarios:', summary.total_scenarios_run)"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mock Services Image
        run: |
          docker build -t integration-monitor-mock:latest -f Dockerfile.mock .

      - name: Build Monitor API Image
        run: |
          docker build -t integration-monitor-api:latest -f Dockerfile.monitor .
